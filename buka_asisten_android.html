<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buka Asisten</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#111;color:#fff;
       min-height:100vh;display:grid;place-items:center;margin:0}
  .card{width:min(92%,420px);box-sizing:border-box;background:#1d1d1f;border-radius:22px;
        padding:28px;text-align:center;box-shadow:0 12px 40px #0008}
  .icon{font-size:54px;margin-bottom:10px}
  h1{font-size:24px;margin:5px 0 10px}
  p{color:#bbb;line-height:1.5}
  button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:10px;
         font-size:16px;font-weight:700;cursor:pointer}
  #open{background:#fff;color:#111}
  #retry{background:#333;color:#fff}
  #status{font-size:13px;color:#aaa;min-height:20px;margin-top:15px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🎙️</div>
  <h1>Buka Asisten</h1>
  <p>Halaman ini mencoba membuka aplikasi Asisten di Android.</p>
  <button id="open">Buka Asisten</button>
  <button id="retry">Coba Lagi</button>
  <div id="status"></div>
</div>

<script>
const intentUrl =
  'intent://#Intent;' +
  'action=android.intent.action.ASSIST;' +
  'package=com.google.android.googlequicksearchbox;' +
  'end';

const status = document.getElementById('status');

function openAssistant(){
  status.textContent = 'Mencoba membuka Asisten…';

  // Android Chrome: gunakan Intent URI.
  window.location.href = intentUrl;

  // Jika Intent tidak ditangani, tampilkan pesan setelah beberapa saat.
  setTimeout(() => {
    status.textContent =
      'Jika tidak terbuka, tekan "Buka Asisten" lagi atau buka Asisten secara manual.';
  }, 1800);
}

document.getElementById('open').addEventListener('click', openAssistant);
document.getElementById('retry').addEventListener('click', openAssistant);

// Mencoba otomatis saat halaman dibuka.
// Browser/WhatsApp dapat memblokir peluncuran otomatis; tombol tetap tersedia.
setTimeout(openAssistant, 500);
</script>
</body>
</html>
