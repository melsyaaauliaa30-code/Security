<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Launcher Asisten</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101827;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px}
main{width:min(100%,420px);background:#1b2638;border:1px solid #34445d;border-radius:24px;padding:28px;box-shadow:0 16px 48px #0005;text-align:center}
.icon{width:76px;height:76px;border-radius:18px;background:#f3f4f6;display:grid;place-items:center;margin:0 auto 18px}
.icon svg{width:60px;height:60px}h1{margin:0 0 8px;font-size:25px}p{color:#cbd5e1;line-height:1.5;margin:0 0 22px}
button{border:0;border-radius:14px;background:#3b82f6;color:white;font-weight:700;font-size:17px;padding:16px 20px;width:100%;cursor:pointer}
.note{font-size:13px;margin-top:18px;color:#9fb0c6}#msg{margin-top:16px;font-size:14px;color:#fde68a;min-height:20px}
</style></head><body>
<main>
<div class="icon" aria-label="Ikon Asisten"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="31" cy="30" r="27" fill="#4285f4"/><circle cx="72" cy="45" r="13" fill="#ea4335"/><circle cx="62" cy="78" r="15" fill="#fbbc04"/><circle cx="88" cy="28" r="7" fill="#34a853"/></svg></div>
<h1>Launcher Asisten</h1>
<p>Tekan tombol di bawah untuk mencoba membuka aplikasi Asisten yang terpasang pada perangkat Android ini.</p>
<button id="launch">BUKA ASISTEN</button>
<div id="msg" role="status"></div>
<p class="note">Jika aplikasi tidak terbuka, perangkat atau browser mungkin memblokir tautan peluncuran. Pastikan aplikasi Asisten terpasang.</p>
</main>
<script>
const intentUrl='intent://launch#Intent;scheme=homesafe;package=net.homesafe;component=net.homesafe/com.safe.activity.EntryActivity;end';
document.getElementById('launch').addEventListener('click',()=>{
 document.getElementById('msg').textContent='Mencoba membuka Asisten…';
 window.location.href=intentUrl;
});
</script></body></html>
